<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map Chart D3.js</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .tooltip {
      position: absolute;
      background-color: lightsteelblue;
      border: solid 1px #ddd;
      border-radius: 5px;
      padding: 10px;
      opacity: 0;
      white-space: nowrap;
    }
    #world-map{
      transform: scale(1);
    }
    .mapContainer {
      width: 50%;
      height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center; /* 수정 */
    }
    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
    }
    .legend rect {
      width: 20px;
      height: 20px;
      float: left;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="mapContainer">
    <svg id="world-map" width="960" height="600"></svg>
    <!-- 바를 표시할 영역 -->
    <div class="legend"></div>
  </div>

  <script>
    const continentData = new Map();
    const svg = d3.select("#world-map");

    const tooltip = d3.select("body").append("div")
      .attr("class", "tooltip")
      .style("opacity", 0);

    const projection = d3.geoMercator()
      .scale(100)
      .rotate([220,0])
      .translate([480, 420]);

    const path = d3.geoPath()
      .projection(projection);

    const color = d3.scaleSequential(d3.interpolateBlues);

    function loadData() {
      d3.json("./js/world.json")
        .then(function(world) {
          world.features.forEach(function(feature) {
            const id = feature.id;
            let obj = {data1: Math.random() * 100 , data2: Math.floor(Math.random() * 100), data3 : Math.floor(Math.random() * 100)}
            continentData.set(id, obj);
          });

          const colorScale = d3.scaleLinear()
            .domain([0, 0.3, 0.6, 1])
            .range(["green", "orange", "red"]);
            const dounutColor = d3.scaleLinear()
            .domain([0, 0.3, 0.6, 1])
            .range(["blue", "green", "red"]);

          // Draw map
          svg.selectAll("path")
            .data(world.features)
            .enter().append("path")
            .attr("class", "country")
            .attr("d", path)
            .attr("fill", function(d) {
              const continent = d.id;
              if (continentData.has(continent)) {
                const dataValue = continentData.get(continent).data1;
                const normalizedValue = dataValue / 100;
                return colorScale(normalizedValue);
              } else {
                return "grey";
              }
            })
            .on("mouseover", function(event, d) {
              const id = d.id;
              if(!continentData.get(id)) return;
              d3.select(this)
                .attr("fill-opacity", 0.5);
              const data = continentData.get(id);
              tooltip.transition().duration(0).style("opacity", 0.9).style("display", "block").style("transform","scale(0.7)");
              tooltip.html("Country Name:" + d.properties.name +
                "<br/>id: " + d.id +
                "<br/><span style='color:" + dounutColor.range()[0] + ";'>1번 데이터: " + data.data1 + "</span>" +
                "<br/><span style='color:" + dounutColor.range()[1] + ";'>2번 데이터: " + data.data2 + "</span>" +
                "<br/><span style='color:" + dounutColor.range()[2] + ";'>3번 데이터: " + data.data3 + "</span>" +
                "<br/><div id='donut-chart'></div>")
                .style("left", (event.clientX-3) + "px")
                .style("top", (event.clientY-5) + "px");
              const donutData = [data.data1, data.data2, data.data3];
              const width = 100;
              const height = 100;
              const radius = Math.min(width, height) / 2;

              const svg = d3.select("#donut-chart")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

              const color = d3.scaleOrdinal()
                .domain(d3.range(donutData.length))
                .range(dounutColor.range());

              const pie = d3.pie()
                .value(function(d) { return d; })
                .sort(null);

              const arc = d3.arc()
                .innerRadius(radius * 0.4)
                .outerRadius(radius * 0.8);

              const arcs = svg.selectAll("arc")
                .data(pie(donutData))
                .enter()
                .append("g")
                .attr("class", "arc");

              arcs.append("path")
                .attr("fill", function(d, i) {
                  return color(i);
                })
                .attr("d", arc);
            })
            .on("mouseout", function(d) {
              d3.select(this)
                .attr("fill-opacity", 1);
              tooltip.transition().duration(0).style("opacity", 0).style("display", "none");
            });
        })
        .catch(function(error) {
          console.error("Error loading data:", error);
        });
    }

    // 바 표시 함수
    function drawLegend() {
      const legendData = [0, 0.3, 0.6]; // 바에 대한 데이터
      const legendColors = ["green", "orange", "red"]; // 바 색상

      const legend = d3.select(".legend");

      legend.selectAll("div")
        .data(legendData)
        .enter().append("div")
        .style("clear", "both")
        .each(function (d, i) {
          const legendItem = d3.select(this);
          legendItem.append("div")
            .style("float", "left")
            .style("background-color", legendColors[i])
            .style("width", "20px")
            .style("height", "20px");
          legendItem.append("span").text(function () {
            if (i === legendData.length - 1) return "수치 : "+(d * 100)+"-";
            else return "수치 : "+(d * 100) + " - " + (legendData[i + 1] * 100);
          });
        });
    }

    loadData();
    drawLegend(); // 바 표시 함수 호출

  </script>
</body>
</html>
