<!-- Styles -->
<style>
  #chartdiv {
    width: 80%;
    height: 80%;
    max-width: 100%;
    background-color: transparent;
  }
  .mapContainer {
    width: 100%;
    height: 100%;
    background-color: #6d6d6d;
  }
  .info {
    color: white;
    width: 10%;
    height: 15%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
</style>

<!-- Resources -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<!-- Chart code -->
<script>
am5.ready(function() {
  am5.addLicense("AM5M11203148921121");
  // Create root element
  var root = am5.Root.new("chartdiv");

  // Set themes
  root.setThemes([am5themes_Animated.new(root)]);

  // Create the map chart
  chart = root.container.children.push(am5map.MapChart.new(root, {
    panX: "rotateX",
    panY: "rotateY",
    wheelY:"none",
    projection: am5map.geoOrthographic(),
    paddingBottom: 20,
    paddingTop: 20,
    paddingLeft: 20,
    paddingRight: 20
  }));

  // Create main polygon series for countries
  var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
    geoJSON: am5geodata_worldLow
  }));
  // Create polygon series for projected circles
  var circleSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));

  var countryValues = {
  "CN": 1,
  "IN": 100
};
console.log(chart);
  console.log("polygonSeries.mapPolygons.template");
  polygonSeries.mapPolygons.template.setAll({
    tooltipText: "{name} {id}",
    toggleKey: "active",
    interactive: true,
    fill: am5.color("rgba(255,255,255,1)"),
    strokeWidth: 0.1,
    stroke: am5.color(0x000000),
    value: 0
  });

  polygonSeries.mapPolygons.template.states.create("hover", {
    fill: am5.color("rgba(206,145,7,1)")
  });

  // Register click event
  polygonSeries.mapPolygons.template.events.on("click", function(ev) {
    let countryId = ev.target.dataItem.dataContext.id;
    let countryName = ev.target.dataItem.dataContext.name;
    let value = countryValues[countryId];
    // You can add code here to update the information displayed in your HTML
    document.querySelector(".country").innerText = `국가: ${countryName}`;
    document.querySelector(".countryId").innerText = `국가 id: ${countryId}`;
    document.querySelector(".information").innerText = "값: " + (value ? value : "");
    
    // Get the centroid of the clicked country
    console.log(ev.target.dataItem.dataContext);
    let centroid = am5map.getGeoCentroid(ev.target.dataItem.dataContext.geometry);
    console.log(centroid);
    chart.events.off("pointerout");
    // Animate the rotation to center the clicked country
    chart.animate({
      key: "rotationX",
      to: -centroid.longitude,
      duration: 1000, // 1 second
      easing: am5.ease.out(am5.ease.cubic)
    });

    chart.animate({
      key: "rotationY",
      to: -centroid.latitude,
      duration: 1000,
      easing: am5.ease.out(am5.ease.cubic)
    });

    setTimeout(function(){
      chart.events.on("pointerout", function() {
        rotationAnimation=createAnimation(chart.get("rotationX"));
      });
    }, 1000);
  });

  polygonSeries.mapPolygons.template.adapters.add("fill", function(fill, target) {
    let id = target.dataItem.dataContext.id;
    let value = countryValues[id];
    if (value) {
      if (value < 30)
        return am5.color(0x7AFE65);  // Light green
      else if (value >= 30 && value < 60)
        return am5.color(0xFEC465);  // Orange
      else
        return am5.color(0xFE6565);  // Red
    } else {
      return fill;  // Solid white
    }
  });

  // Create series for background fill
  var backgroundSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {}));
  backgroundSeries.mapPolygons.template.setAll({
    fill: am5.color("rgb(255,255,255)"),
    fillOpacity: 0,
    strokeOpacity: 0
  });
  backgroundSeries.data.push({
    geometry: am5map.getGeoRectangle(90, 180, -90, -180)
  });
  var graticuleSeries = chart.series.push(am5map.GraticuleSeries.new(root, {}));
  graticuleSeries.mapLines.template.setAll({ strokeOpacity: 0, stroke: root.interfaceColors.get("alternativeBackground") });

  createAnimation(chart.get("rotationX"));

  // Stop animation on mouse over and resume on mouse out
  chart.events.on("pointerover", function() {
    rotationAnimation.pause();
  });

  chart.events.on("pointerout", function() {
    rotationAnimation=createAnimation(chart.get("rotationX"));
  });

  // Make stuff animate on load
  chart.appear(1000, 100);

}); // end am5.ready()

function rotate(){
  rotationAnimation=createAnimation(chart.get("rotationX"));
}

function rotatePause(){
  rotationAnimation.pause();
}

function createAnimation(angleX=0) {
  return chart.animate({
    key: "rotationX",
    from: angleX,
    to: angleX + 360,
    duration: 30000,
    loops: Infinity
  });
}
</script>

<!-- HTML -->
<div class="mapContainer">
  <div id="chartdiv"></div>
  <div class="info">
    <span class="countryId"></span>
    <span class="country"></span>
    <span class="information"></span>
  </div>
</div>
