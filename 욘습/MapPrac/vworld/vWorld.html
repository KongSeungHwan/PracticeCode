<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenLayers 9.1.0 침수 흔적도</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.css" type="text/css">
    <style>
        #map {
            width:50%;
            height:50vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
    <script>

        async function getCurrentPosition(){
            return await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject);
            });
        };
        async function point(){
            var position = await getCurrentPosition();
            var latitude = position.coords.latitude;
            var longitude = position.coords.longitude;
            console.log(latitude);
            console.log(longitude);
            loadMap(longitude,latitude);
        }

        (function(){
            point();
        })()
        //즉시 실행함수 document ready 함수 써야함!

        function loadMap(lon,lat){
            // VWorld 지도 WMS 레이어 URL 설정
            const wmsUrl = 'https://www.safemap.go.kr/openApiService/wms/getLayerData.do?apikey=P3K3CGLO-P3K3-P3K3-P3K3-P3K3CGLOY4&layername=A2SM_FLUDMARKS';
            //위의 api key는 생활안전 apikey 기입!
            const enCowmsUrl = encodeURI(wmsUrl);
            // 지도 객체 생성
            const map = new ol.Map({
                target: 'map', // HTML 내의 지도 컨테이너의 ID
                layers: [
                    // 기본 레이어로 VWorld 지도를 사용합니다.
                    new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: 'http://api.vworld.kr/req/wmts/1.0.0/'+'A28B11D9-66FD-3A74-94B5-BB75CE5B2818'+'/Base/{z}/{y}/{x}.png'
                            //위의 api key는 v-world apikey 기입!
                        })
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([lon, lat]), // latitude,longtitude 변경가능!
                    zoom: 12
                })
            });

            // WMS 레이어 추가
            const wmsLayer = new ol.layer.Tile({
                source: new ol.source.TileWMS({
                    url: enCowmsUrl,
                    params: {
                        'LAYERS': 'A2SM_FLUDMARKS', // 레이어 이름
                        'STYLES': '', // 스타일 (필요한 경우 설정)
                        'FORMAT': 'image/png', // 이미지 형식
                        'SERVICE': 'WMS', // WMS 서비스 타입
                        'VERSION': '1.3.0', // WMS 버전
                        'REQUEST': 'GetMap', // WMS 요청 타입
                        'CRS': 'EPSG:3857', // 좌표 참조 시스템
                        'TRANSPARENT': true // 배경 투명 설정
                    },
                    crossOrigin: 'anonymous'
                }),
                opacity: 0.7 // 레이어 투명도 설정
            });
            // 생성한 WMS 레이어를 지도에 추가
            map.addLayer(wmsLayer);
        }
    </script>
</body>
</html>
