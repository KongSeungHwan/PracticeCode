<!DOCTYPE html>
<html>
<head>
    <title>WMS Layer Example</title>
    <!-- OpenLayers 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/2.13.1/OpenLayers.js"></script>
    <style>
        /* 지도 컨테이너의 크기를 지정 */
        #map {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
       // OpenLayers를 사용하여 WMS 레이어를 초기화하는 예시 코드
        var layers = [
            new ol.layer.Tile({
                source: new ol.source.OSM()  // 기본 OSM 레이어
            }),
            new ol.layer.Image({
                source: new ol.source.ImageWMS({
                    url: 'https://safemap.go.kr/openApiService/wms/getlayerData.do',
                    params: {'LAYERS': 'LAYER_NAME', 'STYLES': 'STYLES', 'FORMAT': 'image/png'},
                    ratio: 1,
                    serverType: 'geoserver',
                    crossOrigin: 'anonymous'
                })
            })
        ];

        // OpenLayers 맵 객체 초기화
        var map = new ol.Map({
            layers: layers,
            target: 'map',  // HTML 요소의 ID
            view: new ol.View({
                center: [0, 0],
                zoom: 1
            })
        });
    </script>
</body>
</html>
