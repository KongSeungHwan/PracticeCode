<!DOCTYPE html>
<html>
<head>
    <title>WMS Layer Example</title>
    <!-- OpenLayers 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/2.13.1/OpenLayers.js"></script>
    <style>
        /* 지도 컨테이너의 크기를 지정 */
        #map {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // JavaScript 코드 시작
        var param = {
            name: '침수흔적도',
            serverUrl: 'www.safemap.go.kr/openApiService/wms/getLayerData.do?apikey=P3K3CGLO-P3K3-P3K3-P3K3-P3K3CGLOY4',
            layername: 'A2SM_FLUDMARKS',
            styles: 'A2SM_FludMarks'
        };

        // OpenLayers 지도 생성
        var map = new OpenLayers.Map('map');

        // WMS 레이어 생성
        var wmsLayer = new OpenLayers.Layer.WMS(
            param.name,
            param.serverUrl,
            {
                layers: '' + param.layername,
                styles: param.styles,
                format: 'image/png',
                exceptions: 'text/xml',
                transparent: true
            },
            {
                isBaseLayer: false
            }
        );

        // WMS 레이어 지도에 추가
        map.addLayer(wmsLayer);

        // 지도 중심점과 줌 레벨 설정
        var lonLat = new OpenLayers.LonLat(126.978, 37.566).transform(new OpenLayers.Projection("EPSG:4326"), map.getProjectionObject());
        var zoom = 10;
        map.setCenter(lonLat, zoom);
        // JavaScript 코드 끝
    </script>
</body>
</html>
