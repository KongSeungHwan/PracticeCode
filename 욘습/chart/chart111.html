<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart.js Multi-Company Data</title>
<style>
    .chart_wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 1100px;
        margin: 20px auto;
    }
    .chart_area {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 600px;
        border: 1px solid rgb(99, 33, 3);
        padding: 20px;
        margin-bottom: 20px;
    }
    .header {
        color: white;
        font-size: 15px;
        font-weight: bold;
        background-color: rgb(99, 33, 3);
        padding: 10px;
        width: 100%;
        text-align: center;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="chart_wrap">
    <div class="chart_area">
        <div class="header">년도별 매출액 및 고용 건수 (단위: 백만원/명)</div>
        <canvas id="chart"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<script>

var colorSet = {
    "대기업": '#334cff',   // 대기업 색상
    "중견기업": '#d56a25', // 중견기업 색상
    "중소기업": '#9c9b97'  // 중소기업 색상
};
// 샘플 데이터 생성 함수
function createData() {
    return [
        {
            company: "대기업",
            color:'#334cff',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        },
        {
            company: "중견기업",
            color: '#d56a25',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        },
        {
            company: "중소기업",
            color: '#9c9b97',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        }
    ];
}

// 랜덤 숫자 생성
function rdNum(max, min) {
    return Math.floor(Math.random() * (max - min) + min);
}

// 차트 생성 함수
function createChart(id,chartData) {

    // 각 기업 규모별 데이터를 데이터셋으로 변환
    const datasets = chartData.map((data, index) => ({
        label: data.company,
        data: data.yearData,
        backgroundColor: data.color,
        borderColor: data.color,
        borderWidth: 1,
        barThickness: 30
    }));
    var context = document.getElementById(id).getContext('2d');
    new Chart(context, {
        type: 'bar',
        data: {
            labels: ["'23", "'24", "'25"], // X축에 표시될 연도
            datasets: datasets
        },
        options: {
            responsive: true,
            title: {
                display: true,
                text: '',
                fontSize: 20
            },
            legend: {
                display: true,
                position: 'bottom'
            },
            scales: {
                yAxes: [{
                    ticks: {
                        beginAtZero: true
                    }
                }]
            }
        }
    });
}

// 페이지 로드 시 차트 생성
window.onload = function() {
    createChart("chart");
};
</script>

</body>
</html>
