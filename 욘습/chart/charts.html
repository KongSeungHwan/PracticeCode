function createBarChart(id, data) {
    // Create root element
    // https://www.amcharts.com/docs/v5/getting-started/#Root_element
    var root = am5.Root.new(id);
    var sortedData = data.sort((e1, e2) => e1.value - e2.value);

    var myTheme = am5.Theme.new(root);
    myTheme.rule("Grid", ["base"]).setAll({
        strokeOpacity: 0.1
    });
    // Set themes
    // https://www.amcharts.com/docs/v5/concepts/themes/
    root.setThemes([
        am5themes_Animated.new(root),
        myTheme
    ]);

    // Create chart
    // https://www.amcharts.com/docs/v5/charts/xy-chart/
    var chart = root.container.children.push(
        am5xy.XYChart.new(root, {
            panX: false,
            panY: false,
            wheelX: "none",
            wheelY: "none",
            paddingLeft: 0
        })
    );

    // Create axes
    // https://www.amcharts.com/docs/v5/charts/xy-chart/axes/
    var yRenderer = am5xy.AxisRendererY.new(root, {
        minGridDistance: 30,
        inside: true,
        visible: false
    });

    yRenderer.labels.template.setAll({
        centerY: am5.percent(100),
        y: am5.percent(100),
        dy: -15,
        text: "{name}  :  {value}"
    });

    // Hide yAxis labels
    yRenderer.grid.template.set("location", 1);
    yRenderer.grid.template.set("strokeOpacity", 0);

    var yAxis = chart.yAxes.push(
        am5xy.CategoryAxis.new(root, {
            maxDeviation: 0,
            categoryField: "name",
            renderer: yRenderer
        })
    );

    var xAxis = chart.xAxes.push(
        am5xy.ValueAxis.new(root, {
            maxDeviation: 0,
            min: 0,
            strictMinMax: false,
            renderer: am5xy.AxisRendererX.new(root, {
                visible: false,
                strokeOpacity: 0.1,
                minGridDistance: 80
            })
        })
    );
    xAxis.get("renderer").grid.template.set("strokeOpacity", 0); // X축 그리드 선을 숨깁니다.
    xAxis.get("renderer").labels.template.set("visible", true);

    // Create background series
    var backgroundSeries = chart.series.push(
        am5xy.ColumnSeries.new(root, {
            xAxis: xAxis,
            yAxis: yAxis,
            valueXField: "maxValue",
            categoryYField: "name",
            fill: am5.color("#D1D1D1"),
            stroke: am5.color("#D1D1D1"),
            clustered: false,
            zIndex: 0
        })
    );

    var bgColumnTemplate = backgroundSeries.columns.template;

    bgColumnTemplate.setAll({
        cornerRadiusBR: 10,
        cornerRadiusTR: 10,
        strokeOpacity: 0,
        fillOpacity: 1
    });

    backgroundSeries.columns.template.adapters.add("height", (height, target) => {
        return 20;
    });

    // Create data series
    var series = chart.series.push(
        am5xy.ColumnSeries.new(root, {
            name: "Series 1",
            xAxis: xAxis,
            yAxis: yAxis,
            valueXField: "value",
            sequencedInterpolation: true,
            categoryYField: "name",
            zIndex: 1
        })
    );

    var columnTemplate = series.columns.template;

    columnTemplate.setAll({
        cursorOverStyle: "pointer",
        tooltipHTML: "<div>{name}:{value}</div>",
        cornerRadiusBR: 10,
        cornerRadiusTR: 10,
        strokeOpacity: 0
    });

    columnTemplate.adapters.add("fill", (fill, target) => {
        return chart.get("colors").getIndex(series.columns.indexOf(target));
    });

    columnTemplate.adapters.add("stroke", (stroke, target) => {
        return chart.get("colors").getIndex(series.columns.indexOf(target));
    });

    series.columns.template.adapters.add("height", (height, target) => {
        return 20;
    });

    yAxis.data.setAll(sortedData);
    series.data.setAll(sortedData);

    series.events.on("datavalidated", function () {
        var maxVal = xAxis.getPrivate("max");

        // 흰색 배경 막대 데이터 설정
        backgroundSeries.data.setAll(sortedData.map(item => ({
            name: item.name,
            maxValue: maxVal
        })));
        xAxis.set("max", maxVal);

        series.appear(1000);
        backgroundSeries.appear();
    });

    chart.appear(1000, 100);
}
function createDoughnutChart(id,data,keyword){

    var root = am5.Root.new(id);
    
    

    root.setThemes([
      am5themes_Animated.new(root)
    ]);
    
    var chart = root.container.children.push(am5percent.PieChart.new(root, {
      innerRadius: 100,
      layout: root.verticalLayout
    }));
    
    

    var series = chart.series.push(am5percent.PieSeries.new(root, {
      valueField: "value",
      categoryField: "name"
    }));
    
    
    series.data.setAll(data.sort((a,b)=>b.value-a.value));
    
    // Add label
    var label = root.tooltipContainer.children.push(am5.Label.new(root, {
      x: am5.p50,
      y: am5.p50,
      centerX: am5.p50,
      centerY: am5.p50,
      fill: am5.color(0x000000),
      fontSize: 50
    }));

    label.set("text", keyword);

    // Create legend
    var legend = chart.children.push(am5.Legend.new(root, {
        centerX: am5.p50,
        x: am5.p50,
        marginTop: 15,
        marginBottom: 15
    }));
    
    // Link series data items to the legend
    legend.data.setAll(series.dataItems);
    
    series.appear(1000, 100);
}
</script>
