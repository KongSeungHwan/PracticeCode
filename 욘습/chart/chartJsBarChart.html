
<style>
    .chart_wrap{
        display:flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .chart_list{
        display:flex;
        flex-wrap:wrap;
        flex-direction:row;
        justify-content: center;
        width:100%;
        max-width: 1300px;

        border: 1px #ddd solid;
        margin:1%;
    }
    .chart_area{
        display:flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        width: 470px;
        height:300px;
        margin:3%;
    }

    .header-text{
        font-size: 30px;
        font-weight: 530;
        margin: 0 5px;
    }
    .header-unit{
        font-size: 8px;
        font-weight: bolder;
        margin: 0 5px;
    }
    .header{
        display:flex;
        flex-direction: row;
        justify-content: space-between;
        align-items:center;
        width:100%;
        height:7.5%;
        margin-bottom: 5%;
    }
    .barChart{
        width:470px;
        height:300px;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<script>
function createData() {
    return [
        {
            company: "대기업",
            color:'#334cff',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        },
        {
            company: "중견기업",
            color: '#d56a25',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        },
        {
            company: "중소기업",
            color: '#9c9b97',
            yearData: [rdNum(100, 1), rdNum(100, 1), rdNum(100, 1)] // '23, '24, '25
        }
    ];
}
function rdNum(max,min){
    return Math.floor(Math.random()*(max-min)+min); 
}
window.onload = function(){
    Array.from({length:8}).map((_,i)=>i+1).forEach(item=>{
        createChart("chart"+item,createData() );
    });
}

function createChart(id,chartData) {

    // 각 기업 규모별 데이터를 데이터셋으로 변환
    const datasets = chartData.map((data, index) => ({
        label: data.company,
        data: data.yearData,
        backgroundColor: data.color,
        borderColor: data.color,
        borderWidth: 1,
        barThickness: 30
    }));
    var context = document.getElementById(id).getContext('2d');
    new Chart(context, {
        type: 'bar',
        data: {
            labels: ["'23", "'24", "'25"], // X축에 표시될 연도
            datasets: datasets
        },
        options: {
            responsive: true,
            title: {
                display: true,
                text: '',
                fontSize: 20
            },
            legend: {
                display: true,
                position: 'bottom'
            },
            scales: {
                xAxes: [{
                    categoryPercentage: 0.5,
                    barPercentage: 1.0
                }],
                yAxes: [{
                    ticks: {
                        beginAtZero: true
                        
                    }
                }]
            }
        }
    });
}
</script>
<div class="chart_wrap">
    <div class="chart_list">
        <div class="chart_area first" id="chart_area">
            <div class="header first"><span class="header-text">광고 매출액</span><span class="header-unit">(단위:백만원)</span></div>
            <canvas id="chart1" class="barChart"></canvas>
        </div>
        <div class="chart_area first" id="chart_area">
            <div class="header first"><span class="header-text">금융 매출액</span><span class="header-unit">(단위:백만원)</span></div>
            <canvas id="chart2" class="barChart"></canvas>
        </div>
        <div class="chart_area first" id="chart_area">
            <div class="header first"> <span class="header-text">통신 매출액</span><span class="header-unit">(단위:백만원)</span></div>
            <canvas id="chart3" class="barChart"></canvas>
        </div>
        <div class="chart_area first" id="chart_area">
            <div class="header first"><span class="header-text">기타 매출액</span><span class="header-unit">(단위:백만원)</span></div>
            <canvas id="chart4" class="barChart"></canvas>
        </div>
    </div>
    <div class="chart_list">
        <div class="chart_area second" id="chart_area">
            <div class="header second"><span class="header-text">광고 고용 건</span><span class="header-unit">(단위:명)</span></div>
            <canvas id="chart5" class="barChart"></canvas>
        </div>
        <div class="chart_area second" id="chart_area">
            <div class="header"><span class="header-text">금융 고용 건</span><span class="header-unit">(단위:명)</span></div>
            <canvas id="chart6" class="barChart"></canvas>
        </div>
        <div class="chart_area second" id="chart_area">
            <div class="header second"> <span class="header-text">통신 고용 건</span><span class="header-unit">(단위:명)</span></div>
            <canvas id="chart7" class="barChart"></canvas>
        </div>
        <div class="chart_area second" id="chart_area">
            <div class="header second"><span class="header-text">기타 고용 건</span><span class="header-unit">(단위:명)</span></div>
            <canvas id="chart8" class="barChart"></canvas>
        </div>
    </div>
</div>
